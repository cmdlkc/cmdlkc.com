<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio Karbon — logo / menu, with cursor lens</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #FFFFFF; }
  /* The plain page. Everything you see, apart from the small lens patch
     that follows the cursor, is drawn inside this one element. */
  #glass { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  /* The lens itself: a small canvas that tracks the pointer. Sized and
     positioned entirely from JS (see LENS below); this just sets the parts
     that never change. */
  #lens { position: fixed; left: 0; top: 0; display: block; pointer-events: none; }
  #fatal { max-width: 46em; padding: 3em; font: 13px/1.8 "Courier New", monospace; color: #333; }
  #fatal code { background: #f0ece6; padding: 0.1em 0.4em; }
</style>
</head>
<body>

<canvas id="glass"></canvas>

<!-- ==========================================================================
     Every tunable number lives in config/, one file per numbered section, and
     all the code lives in js/. Nothing is bundled and nothing is built: these
     are plain <script> tags, they run top to bottom in this order, and that
     order matters at both ends — config/00-header.js creates CONFIG so it has
     to stay first, and js/boot.js checks the rest arrived and then starts
     everything, so it has to stay last.

     Adding a config section? Three places: a new file in config/, a line
     here, and a line in SECTION_FILES at the top of js/boot.js.
     ========================================================================== -->

<script src="config/00-header.js"></script>
<script src="config/01-colour.js"></script>
<script src="config/02-letter.js"></script>
<script src="config/03-ring.js"></script>
<script src="config/04-view.js"></script>
<script src="config/05-dot.js"></script>
<script src="config/06-lines.js"></script>
<script src="config/07-shade.js"></script>
<script src="config/08-motion.js"></script>
<script src="config/09-projects.js"></script>
<script src="config/10-cover.js"></script>
<script src="config/11-feed.js"></script>
<script src="config/12-debug.js"></script>
<script src="config/13-lens.js"></script>
<script src="config/14-about.js"></script>

<script src="js/page.js"></script>
<script src="js/lens.js"></script>
<script src="js/boot.js"></script>

</body>
</html>
