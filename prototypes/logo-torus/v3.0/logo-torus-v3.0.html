  #fatal { max-width: 46em; padding: 3em; font: 13px/1.8 "Courier New", monospace; color: #333; }

<canvas id="glass"></canvas>

<!-- Every number you can tune lives in this file. -->
<script src="logo-torus-v3.0.config.js"></script>

<script>
"use strict";

if (typeof CONFIG === "undefined") {
  document.body.innerHTML =
    '<div id="fatal"><strong>Couldn\'t find logo-torus-v3.0.config.js</strong><br><br>' +
    'It has to sit in the same folder as this HTML file, with exactly that ' +
    'filename. If you renamed it, update the <code>&lt;script src="..."&gt;</code> ' +
    'line near the bottom of this file to match.</div>';
} else {
  window.PAGE = buildPage();
  startGlass();
}

/* ==========================================================================
   STUDIO KARBON — the logo, the menu, the projects, and the glass over them
   --------------------------------------------------------------------------
   v3.0 is v2.3 with the liquid-glass cursor over the top of it — and that one
   sentence hides the whole reason this file is shaped the way it is.

   Glass is colourless. What makes it visible is that it BENDS what is behind
   it. So the glass pass reads the page as a TEXTURE and samples it with the
   coordinates pushed sideways wherever the liquid's surface is sloped. Which
   means anything you want bent has to be in that texture — and you cannot put
   live HTML in a texture.

   So there is no HTML here. Not one element beyond the single canvas. The
   logo, the slice menu, the hover previews, the project feed, its images, its
   captions, the hint line: all of it is drawn with fillText and strokeRect
   into an offscreen 2D canvas, and that canvas is handed to the graphics card
   every frame that something changed.

   Two halves, in order:
     buildPage()   the logo engine and the page drawing. Returns the canvas.
     startGlass()  the fluid simulation and the refraction pass, lifted almost
                   unchanged from the liquid-glass prototype. Its drawScene()
                   now takes PAGE's canvas instead of drawing a fake page.
   ========================================================================== */

function buildPage() {

const C = CONFIG;
const RAD = Math.PI / 180;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
let dirty = true;

function hexToRgb(h) {
  h = h.replace("#", "");
  if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
}
const INK   = hexToRgb(C.colour.ink);
const PAPER = hexToRgb(C.colour.paper);

// Fixed-seed random, so a project's scattered layout is the same every time
// you open it instead of reshuffling under you.
function seeded(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ==========================================================================
   1.  THE PROFILE — the letter D as a flat outline
   Two outlines: the outside of the letter, and the counter (the hole in the
   middle). Both walk the same four segments, the inner one simply inset by
   the stroke width — so outer point i always corresponds to inner point i,
   which is what lets the cut faces be closed with a plain ribbon of quads.
   ========================================================================== */
function buildProfile(L) {
  const W = L.width, H = L.height, t = L.stroke;
  const Rx = W * L.bowl, Ry = H / 2, a = W - Rx;
  const A = Math.max(3, L.arcSteps | 0), E = Math.max(1, L.edgeSteps | 0);

  function path(s) {
    const p = [], rx = Rx - s, ry = Ry - s, x0 = s, y0 = s, y1 = H - s;
    for (let i = 0; i < E; i++) p.push({ x: x0 + (a - x0) * i / E, y: y0 });   // bottom
    for (let i = 0; i < A; i++) {                                              // the bowl
      const th = -Math.PI / 2 + Math.PI * i / A;
      p.push({ x: a + rx * Math.cos(th), y: H / 2 + ry * Math.sin(th) });
    }
    for (let i = 0; i < E; i++) p.push({ x: a + (x0 - a) * i / E, y: y1 });    // top
    for (let i = 0; i < E; i++) p.push({ x: x0, y: y1 + (y0 - y1) * i / E });  // spine
    return p;
  }
  return { outer: path(0), inner: path(t) };
}

/* Expand an outline into segments ready for sweeping. Adjacent segments whose
   directions are close get averaged so the shading and the crease-line test
   flow smoothly across the joint; sharp corners are kept separate. */
function expandOutline(p, creaseDeg) {
  const n = p.length, e = [];
  for (let i = 0; i < n; i++) {
    const q = p[(i + 1) % n], dx = q.x - p[i].x, dy = q.y - p[i].y;
    const l = Math.hypot(dx, dy) || 1;
    e.push({ x: dy / l, y: -dx / l });
  }
  const cosT = Math.cos(creaseDeg * RAD);
  const avg = (A, B) => { const x=A.x+B.x, y=A.y+B.y, l=Math.hypot(x,y)||1; return {x:x/l,y:y/l}; };
  const out = [];
  for (let i = 0; i < n; i++) {
    const prev = e[(i-1+n)%n], cur = e[i], next = e[(i+1)%n], j = (i+1)%n;
    const nA = (prev.x*cur.x + prev.y*cur.y) > cosT ? avg(prev, cur) : cur;
    const nB = (cur.x*next.x + cur.y*next.y) > cosT ? avg(cur, next) : cur;
    out.push({ x: p[i].x, y: p[i].y, nx: nA.x, ny: nA.y });
    out.push({ x: p[j].x, y: p[j].y, nx: nB.x, ny: nB.y });
  }
  return out;   // 2n entries; entries (2i, 2i+1) are the ends of segment i
}

/* ==========================================================================
   2.  THE MESH
   The profile is revolved around the vertical axis, stopping short by a gap of
   `notchSlices` whole slices. The sweep is divided into SLICES — one per project — and every
   triangle remembers which slice it belongs to, which is what makes hover
   picking exact and lets the divider lines be found automatically.
   ========================================================================== */
function buildMesh(C) {
  const L = C.letter, R = C.ring;
  const prof = buildProfile(L);
  const nSlices = Math.max(1, C.projects.length);

  /* The gap is measured in WHOLE SLICES, not degrees. The ring is cut into
     (slices + notchSlices) equal wedges and the last `notchSlices` of them are
     simply not built. That keeps every slice exactly the same size however
     many projects there are, and makes the gap read as "some slices are
     missing" rather than as an arbitrary cut. */
  const wedges = nSlices + Math.max(1, R.notchSlices | 0);
  const notchDeg = 360 * (wedges - nSlices) / wedges;

  // A whole number of steps per wedge, so divider lines land exactly on slice
  // boundaries rather than one step off.
  const perSlice = Math.max(2, Math.round(R.steps / wedges));
  const M = perSlice * nSlices;

  const cx = L.width / 2, cy = L.height / 2;
  const sign = L.flip ? -1 : 1;
  const place = (x) => R.radius + sign * (x - cx);

  const th0 = R.notchAt * RAD + notchDeg * RAD / 2;
  const dth = (360 - notchDeg) * RAD / M;

  const pos = [], nrm = [], idx = [], tslice = [], tcap = [];
  const push = (px, py, pz, nx, ny, nz) => { pos.push(px,py,pz); nrm.push(nx,ny,nz); return pos.length/3 - 1; };

  function sweepOutline(outline, flipNormal) {
    const K = outline.length, base = pos.length / 3;
    for (let j = 0; j <= M; j++) {
      const th = th0 + dth * j, ct = Math.cos(th), st = Math.sin(th);
      for (let i = 0; i < K; i++) {
        const v = outline[i], r = place(v.x), f = flipNormal ? -1 : 1;
        push(r*ct, v.y - cy, r*st, f*v.nx*ct, f*v.ny, f*v.nx*st);
      }
    }
    for (let j = 0; j < M; j++) {
      const sl = (j / perSlice) | 0;
      for (let i = 0; i < K; i += 2) {
        const A = base + j*K + i, B = A + 1, D = base + (j+1)*K + i, E = D + 1;
        idx.push(A,B,E, A,E,D);
        tslice.push(sl, sl); tcap.push(0, 0);
      }
    }
  }

  sweepOutline(expandOutline(prof.outer, R.creaseAngle), false);
  sweepOutline(expandOutline(prof.inner, R.creaseAngle), true);

  function cap(th, nx, ny, nz, sl) {
    const ct = Math.cos(th), st = Math.sin(th);
    const n = prof.outer.length, base = pos.length / 3;
    for (let i = 0; i < n; i++) {
      const o = prof.outer[i], q = prof.inner[i];
      const ro = place(o.x), ri = place(q.x);
      push(ro*ct, o.y - cy, ro*st, nx, ny, nz);
      push(ri*ct, q.y - cy, ri*st, nx, ny, nz);
    }
    for (let i = 0; i < n; i++) {
      const A = base + 2*i, B = A + 1, D = base + 2*((i+1)%n), E = D + 1;
      idx.push(A,B,E, A,E,D);
      tslice.push(sl, sl); tcap.push(1, 1);      // the two faces of the cut
    }
  }
  const th1 = th0 + dth * M;
  cap(th0,  Math.sin(th0), 0, -Math.cos(th0), 0);
  cap(th1, -Math.sin(th1), 0,  Math.cos(th1), nSlices - 1);

  // Rather than reason about winding order by hand for every case, flip any
  // triangle whose geometric facing disagrees with the surface directions on
  // its corners. After this, backface culling is one sign test.
  for (let t = 0; t < idx.length; t += 3) {
    const i0 = idx[t]*3, i1 = idx[t+1]*3, i2 = idx[t+2]*3;
    const ax=pos[i1]-pos[i0], ay=pos[i1+1]-pos[i0+1], az=pos[i1+2]-pos[i0+2];
    const bx=pos[i2]-pos[i0], by=pos[i2+1]-pos[i0+1], bz=pos[i2+2]-pos[i0+2];
    const gx=ay*bz-az*by, gy=az*bx-ax*bz, gz=ax*by-ay*bx;
    const sx=nrm[i0]+nrm[i1]+nrm[i2], sy=nrm[i0+1]+nrm[i1+1]+nrm[i2+1], sz=nrm[i0+2]+nrm[i1+2]+nrm[i2+2];
    if (gx*sx + gy*sy + gz*sz < 0) { const s = idx[t+1]; idx[t+1] = idx[t+2]; idx[t+2] = s; }
  }

  let radius = 0;
  for (let i = 0; i < pos.length; i += 3) {
    const d = Math.hypot(pos[i], pos[i+1], pos[i+2]);
    if (d > radius) radius = d;
  }

  return {
    pos: new Float32Array(pos), nrm: new Float32Array(nrm),
    idx: new Uint32Array(idx),  tri: new Uint8Array(tslice),
    cap: new Uint8Array(tcap),
    vertCount: pos.length/3, triCount: idx.length/3,
    radius, nSlices, notchDeg,
  };
}

const mesh = buildMesh(C);
const NS = mesh.nSlices;

/* ==========================================================================
   3.  BAYER
   The tile is fixed to the SCREEN, so the ring turns underneath the dots and
   they stay put — exactly like the cube cursor on the main site.
   ========================================================================== */
function buildBayer(size) {
  const S = (size === 2 || size === 4 || size === 8) ? size : 8;
  let m = [[0,2],[3,1]];
  while (m.length < S) {
    const n = m.length, o = [];
    for (let y = 0; y < n*2; y++) o.push(new Array(n*2));
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
      const v = m[y][x]*4;
      o[y][x]=v; o[y][x+n]=v+2; o[y+n][x]=v+3; o[y+n][x+n]=v+1;
    }
    m = o;
  }
  const flat = new Float32Array(S*S);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) flat[y*S+x] = (m[y][x]+0.5)/(S*S);
  return { t: flat, size: S, mask: S-1 };
}
const bayer = buildBayer(C.shade.matrix);
const BT = bayer.t, BS = bayer.size, BM = bayer.mask;

/* ==========================================================================
   5.  POSE — quaternions
   --------------------------------------------------------------------------
   Orientation is a quaternion, which is the only representation that does all
   three things this needs at once:

     · free tumble       drag it any direction and it turns that way, with no
                         orientation where two of the controls collapse into
                         one (the "gimbal lock" you get from Euler angles)
     · idle spin         turn about the ring's OWN axle, whatever angle the
                         ring is currently sitting at
     · a clean snap      slide smoothly from wherever it happens to be to the
                         exact top-down pose, along the shortest path

   v2.0 used a yaw and a tilt, which handled the snap but could only ever spin
   about one axis. A plain 3x3 matrix handles the tumble but cannot be
   interpolated without extra machinery. Quaternions do both.

   Convention: q = [w, x, y, z], and qToMat gives the matrix M where a world
   point becomes a view point as M * p.
   ========================================================================== */
const easeInOut = t => (t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2);

function T(v) { return { v, from: v, to: v, t: 1, dur: 1 }; }
function to(tw, target, ms) {
  if (tw.to === target && tw.t >= 1) { tw.v = target; return; }
  tw.from = tw.v; tw.to = target; tw.t = 0; tw.dur = Math.max(1, ms) / 1000;
}
function step(tw, dt) {
  if (tw.t >= 1) return false;
  tw.t = Math.min(1, tw.t + dt / tw.dur);
  tw.v = tw.from + (tw.to - tw.from) * easeInOut(tw.t);
  return true;
}

// a then b, i.e. the same as the matrix product A * B
function qMul(a, b) {
  return [
    a[0]*b[0] - a[1]*b[1] - a[2]*b[2] - a[3]*b[3],
    a[0]*b[1] + a[1]*b[0] + a[2]*b[3] - a[3]*b[2],
    a[0]*b[2] - a[1]*b[3] + a[2]*b[0] + a[3]*b[1],
    a[0]*b[3] + a[1]*b[2] - a[2]*b[1] + a[3]*b[0],
  ];
}
function qAxis(ax, ay, az, deg) {
  const l = Math.hypot(ax, ay, az);
  if (l < 1e-12 || deg === 0) return [1, 0, 0, 0];
  const h = deg * RAD / 2, s = Math.sin(h) / l;
  return [Math.cos(h), ax*s, ay*s, az*s];
}
function qNorm(q) {
  const l = Math.hypot(q[0], q[1], q[2], q[3]) || 1;
  return [q[0]/l, q[1]/l, q[2]/l, q[3]/l];
}
function qToMat(q) {
  const [w, x, y, z] = q;
  return [
    1-2*(y*y+z*z),   2*(x*y - w*z),   2*(x*z + w*y),
      2*(x*y + w*z), 1-2*(x*x+z*z),   2*(y*z - w*x),
      2*(x*z - w*y),   2*(y*z + w*x), 1-2*(x*x+y*y),
  ];
}
function qSlerp(a, b, t) {
  let d = a[0]*b[0] + a[1]*b[1] + a[2]*b[2] + a[3]*b[3];
  // Two quaternions describe every orientation; pick the one that is the
  // short way round rather than the long way.
  if (d < 0) { b = [-b[0], -b[1], -b[2], -b[3]]; d = -d; }
  if (d > 0.9995) return qNorm([a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t,
                                a[2]+(b[2]-a[2])*t, a[3]+(b[3]-a[3])*t]);
  const th = Math.acos(d), s = Math.sin(th);
  const k0 = Math.sin((1-t)*th) / s, k1 = Math.sin(t*th) / s;
  return [a[0]*k0+b[0]*k1, a[1]*k0+b[1]*k1, a[2]*k0+b[2]*k1, a[3]*k0+b[3]*k1];
}

/* The nearest pose at a given tilt.
   Every resting pose is "tip by `tilt`, then turn by some amount about the
   ring's own axis". Of that whole family we want the member closest to where
   the ring is right now, so a snap tips it up without also unwinding a spin
   it never needed to undo.

   Working it out rather than searching: strip the tilt off the current
   orientation, and what is left is read directly as the turn we should keep. */
function nearestPose(tiltDeg) {
  const qt = qAxis(1, 0, 0, tiltDeg);
  const inv = [qt[0], -qt[1], -qt[2], -qt[3]];
  const p = qMul(inv, q);
  const spinDeg = 2 * Math.atan2(p[2], p[0]) / RAD;
  return qNorm(qMul(qt, qAxis(0, 1, 0, spinDeg)));
}

/* A pose at a given tilt with a specific turn, rather than the nearest one.
   Used where the gap has to end up somewhere particular. Slerp still takes
   the short way round, so asking for "turn 20" from "turn 380" does not
   unwind a full revolution. */
function fixedPose(tiltDeg, spinDeg) {
  return qNorm(qMul(qAxis(1, 0, 0, tiltDeg), qAxis(0, 1, 0, spinDeg)));
}

/* Looking straight down, a point at azimuth th on the ring lands at screen
   angle (th - turn), measuring clockwise from due right. So to put the gap at
   a chosen screen angle, turn the ring by the difference. */
function topPoseSpin() { return C.ring.notchAt - C.view.topOpenAt; }

/* At an angled view the gap points most directly at the camera when the ring
   is turned to (its azimuth - 90). Falls straight out of the view matrix: the
   towards-camera component of a direction at azimuth th is
   cos(tilt) * sin(th - turn), which peaks at th - turn = 90. */
function cornerPoseSpin() { return C.ring.notchAt - 90 + C.view.cornerTurn; }

let q = qNorm(qMul(qAxis(1, 0, 0, C.view.tiltRest), qAxis(0, 1, 0, 0)));

// The snap between poses, as a slerp rather than a tween of numbers.
let slerpA = null, slerpB = null, slerpT = 1, slerpDur = 1;
function poseTo(target, ms) {
  slerpA = q; slerpB = target; slerpT = 0; slerpDur = Math.max(1, ms) / 1000;
}

const sizeT    = T(C.view.size);
const cxT      = T(0.5), cyT = T(0.5);   // logo centre, as a fraction of window

let state = "spin";                 // "spin" | "top" | "project"
let openProject = -1;

// Momentum from a throw, as a rotation axis and rate rolled into one vector,
// in SCREEN space: its direction is the axis, its length the degrees per
// second. Screen space is what makes a flick keep going the way your hand
// went, rather than the way the object happens to be facing.
let omega = [0, 0, 0];
const sliceShade = new Float32Array(NS);
const sliceTarget = new Float32Array(NS);
let hoverSlice = -1;
let dotShade = 0, dotTarget = 0, dotVisible = false;

/* ==========================================================================
   6.  RASTERISER
   Walk each triangle's bounding box; a pixel is inside when all three edge
   functions agree in sign. Record depth, surface direction and slice id.
   ========================================================================== */
function drawTriangle(i0, i1, i2, sl, isCap) {
  const x0=sxA[i0], y0=syA[i0], x1=sxA[i1], y1=syA[i1], x2=sxA[i2], y2=syA[i2];

  // Signed area doubles as the facing test: every triangle was wound
  // consistently at build time, so negative means we are seeing its front.
  const area = (x1-x0)*(y2-y0) - (y1-y0)*(x2-x0);
  if (area >= -1e-7) return;

  const minX = Math.max(0,   Math.floor(Math.min(x0,x1,x2)));
  const maxX = Math.min(W-1, Math.ceil (Math.max(x0,x1,x2)));
  const minY = Math.max(0,   Math.floor(Math.min(y0,y1,y2)));
  const maxY = Math.min(H-1, Math.ceil (Math.max(y0,y1,y2)));
  if (minX > maxX || minY > maxY) return;

  const inv = 1/area;
  const z0=szA[i0], z1=szA[i1], z2=szA[i2];
  const a0=vnx[i0], b0=vny[i0], c0=vnz[i0];
  const a1=vnx[i1], b1=vny[i1], c1=vnz[i1];
  const a2=vnx[i2], b2=vny[i2], c2=vnz[i2];
  const A0=y1-y2, B0=x2-x1, A1=y2-y0, B1=x0-x2, A2=y0-y1, B2=x1-x0;

  for (let y = minY; y <= maxY; y++) {
    const pyc = y + 0.5, row = y*W;
    let w0 = A0*(minX+0.5-x1) + B0*(pyc-y1);
    let w1 = A1*(minX+0.5-x2) + B1*(pyc-y2);
    let w2 = A2*(minX+0.5-x0) + B2*(pyc-y0);
    for (let x = minX; x <= maxX; x++, w0+=A0, w1+=A1, w2+=A2) {
      if (w0 > 0 || w1 > 0 || w2 > 0) continue;
      const l0=w0*inv, l1=w1*inv, l2=w2*inv;
      const z = l0*z0 + l1*z1 + l2*z2;
      const p = row + x;
      if (z <= depth[p]) continue;
      depth[p] = z;
      gnx[p] = l0*a0 + l1*a1 + l2*a2;
      gny[p] = l0*b0 + l1*b1 + l2*b2;
      gnz[p] = l0*c0 + l1*c1 + l2*c2;
      sbuf[p] = sl;
      cbuf[p] = isCap;
    }
  }
}

/* ==========================================================================
   7.  PAINT
   Two passes over the logo's bounding box only — not the whole window.
   Pass 1: paper everywhere, plus dither dots on any slice that is lit up.
   Pass 2: the lines, read straight off the depth and slice buffers.
   ========================================================================== */
const INK_R = INK[0], INK_G = INK[1], INK_B = INK[2];
const CAP_SHADE = C.shade.capFaces;
const PAP_R = PAPER[0], PAP_G = PAPER[1], PAP_B = PAPER[2];

function paint(box) {
  const LIGHT = (() => {
    const d = C.shade.lightDirection, l = Math.hypot(d.x,d.y,d.z) || 1;
    return [d.x/l, d.y/l, d.z/l];
  })();
  const lx=LIGHT[0], ly=LIGHT[1], lz=LIGHT[2];
  const INK_MIN = C.shade.lightestFace, INK_MAX = C.shade.darkestFace;
  const showIds = C.debug.showSliceIds;

  for (let y = box.y0; y <= box.y1; y++) {
    const brow = (y & BM) * BS, row = y*W;
    for (let x = box.x0; x <= box.x1; x++) {
      const p = row + x, o = p*4;
      const sl = depth[p] === FAR ? -1 : sbuf[p];

      if (sl < 0) { px[o+3] = 0; continue; }          // nothing here — see through

      // Normalise once and write it back, so the line pass that follows needs
      // no square roots at all.
      let nx = gnx[p], ny = gny[p], nz = gnz[p];
      const l2 = nx*nx + ny*ny + nz*nz;
      if (l2 > 0) { const iv = 1/Math.sqrt(l2); nx*=iv; ny*=iv; nz*=iv; gnx[p]=nx; gny[p]=ny; gnz[p]=nz; }

      /* The two faces of the cut are shaded whether or not anything is
         hovered. That is what makes the letters read: the D on one face and
         its mirror on the other are the C and the D, and as bare outlines in
         a wireframe they were just more lines among lines. Filled with dither
         they read as letterforms. */
      let sh = showIds ? (sl + 1) / (NS + 1) : sliceShade[sl];
      if (cbuf[p] && CAP_SHADE > sh) sh = CAP_SHADE;
      if (sh <= 0.002) { px[o+3] = 0; continue; }     // unlit body — see through

      // The cube cursor's shading model exactly: ONE colour, and tone comes
      // from how many dots get printed. A lit face prints few; a face in
      // shadow prints many. Nothing is ever a paler orange.
      const lam = nx*lx + ny*ly + nz*lz;
      const ink = (INK_MAX - (INK_MAX - INK_MIN) * (lam > 0 ? lam : 0)) * sh;

      if (ink > BT[brow + (x & BM)]) { px[o]=INK_R; px[o+1]=INK_G; px[o+2]=INK_B; px[o+3]=255; }
      else                           { px[o+3] = 0; }
    }
  }
}

function paintLines(box) {
  const sil = C.lines.silhouette;
  const dTh = C.lines.depth * mesh.radius * scalePx();
  const doD = C.lines.depth > 0;
  const cTh = Math.cos(clamp(C.lines.crease, 0, 179) * RAD);
  const doC = C.lines.crease > 0;
  const doDiv = C.lines.dividers;

  for (let y = box.y0; y <= box.y1; y++) {
    const brow = (y & BM) * BS, row = y*W;
    for (let x = box.x0; x <= box.x1; x++) {
      const p = row + x;
      const z = depth[p];
      if (z === FAR) continue;
      const nx = gnx[p], ny = gny[p], nz = gnz[p], sl = sbuf[p];
      let edge = false, divAmt = 0;

      for (let k = 0; k < 4; k++) {
        let q;
        if      (k === 0) { if (x === 0)   { if (sil) { edge = true; break; } continue; } q = p-1; }
        else if (k === 1) { if (x === W-1) { if (sil) { edge = true; break; } continue; } q = p+1; }
        else if (k === 2) { if (y === 0)   { if (sil) { edge = true; break; } continue; } q = p-W; }
        else              { if (y === H-1) { if (sil) { edge = true; break; } continue; } q = p+W; }

        const zq = depth[q];
        if (zq === FAR) { if (sil) { edge = true; break; } continue; }
        if (doD && (z - zq) > dTh) { edge = true; break; }
        if (doC && (nx*gnx[q] + ny*gny[q] + nz*gnz[q]) < cTh) { edge = true; break; }
        // A divider only exists while one of the two slices it separates is
        // lit up. With nothing hovered the ring has no internal lines at all
        // — it reads as one object until you ask it to be a menu.
        if (doDiv && sbuf[q] !== sl && sbuf[q] >= 0) {
          const a = sliceShade[sl] > sliceShade[sbuf[q]] ? sliceShade[sl] : sliceShade[sbuf[q]];
          if (a > divAmt) divAmt = a;
        }
      }

      // Dividers dissolve in and out through the same dither grid rather than
      // snapping on, so part-way through they read as a dotted line.
      if (!edge && divAmt > 0.002 && divAmt > BT[brow + (x & BM)]) edge = true;

      if (edge) { const o = p*4; px[o]=INK_R; px[o+1]=INK_G; px[o+2]=INK_B; px[o+3]=255; }
    }
  }
}

/* The centre dot.
   Two things make it feel like part of the object rather than stuck on top:

   1. It is DEPTH TESTED. The dot sits at the ring's centre, which in view
      space is exactly z = 0 — so it is drawn only where the surface at that
      pixel is further away than 0, or where there is no surface. Turn the
      ring so its near side swings across the middle and the dot goes behind
      it, properly.

   2. It grows into a star under the cursor. At rest it is a plain disc; the
      further the hover fades in, the more the outline pulls out into points.
      Same eased fade as everything else — nothing here snaps on. */
function paintDot() {
  if (!C.dot.show) return;
  const D = C.dot;
  const t = dotShade;
  const core  = D.radius * (1 + D.grow * t);
  const spike = D.radius * D.spike;
  const rMax  = Math.ceil(Math.max(core, spike) + 1);
  const L = logoCentre();
  const cx = Math.round(L.ox), cy = Math.round(L.oy);
  const N = Math.max(2, D.points | 0);

  for (let dy = -rMax; dy <= rMax; dy++) {
    const y = cy + dy; if (y < 0 || y >= H) continue;
    for (let dx = -rMax; dx <= rMax; dx++) {
      const x = cx + dx; if (x < 0 || x >= W) continue;
      const d = Math.sqrt(dx*dx + dy*dy);
      if (d > rMax) continue;

      // How far the outline reaches at this angle: a circle at t = 0, pulled
      // out into N points as the hover fades in.
      let rr = core;
      if (t > 0.002) {
        const ang = Math.atan2(dy, dx);
        // The four main arms.
        const lobe = Math.abs(Math.cos(N * ang / 2));
        rr = core + (spike - core) * Math.pow(lobe, D.sharpness) * t;
        // A second set turned half a lobe on, so they land in the gaps
        // between the main arms. Shorter and much thinner, which is what
        // makes it read as a star rather than as a plus sign.
        if (D.diagonal > 0) {
          const lobeD = Math.abs(Math.cos(N * (ang - Math.PI / N) / 2));
          const rd = core + (spike * D.diagonal - core) * Math.pow(lobeD, D.diagonalSharpness) * t;
          if (rd > rr) rr = rd;
        }
      }
      if (d > rr) continue;

      const p = y*W + x;
      if (depth[p] !== FAR && depth[p] > 0) continue;   // behind the ring
      const o = p*4;
      px[o]=INK_R; px[o+1]=INK_G; px[o+2]=INK_B; px[o+3]=255;
    }
  }
}

// Is the dot's own centre in front of the ring? Used both to decide whether
// it can be hovered and to keep the cursor from puffing up a dot you can't
// actually see.
function dotIsVisible() {
  const L = logoCentre();
  const x = Math.round(L.ox), y = Math.round(L.oy);
  if (x < 0 || y < 0 || x >= W || y >= H) return false;
  const d = depth[y*W + x];
  return d === FAR || d <= 0;
}

/* ==========================================================================
   4.  THE SURFACE EVERYTHING IS DRAWN ON
   --------------------------------------------------------------------------
   In v2.x the logo was a canvas and the feed was HTML sitting above it. Here
   there is no HTML at all — not one element. Everything is drawn into a
   single offscreen 2D canvas, and that canvas is what the glass bends.

   It has to work that way round: you cannot refract live HTML. The glass pass
   samples a texture with the coordinates pushed sideways wherever the liquid
   is sloped, so whatever you want bent has to BE that texture. Which is why
   the project feed below is drawn with fillText and strokeRect rather than
   written as markup.

   Two canvases, then:
     logoCanvas   small, one pixel per rendered pixel, where the wireframe is
                  rasterised. Blown up with smoothing off — the hard pixel
                  edges come from here.
     scene        full window at device resolution. Paper, feed, logo, cover,
                  hint. This is what gets handed to the glass.
   ========================================================================== */

const scene    = document.createElement("canvas");
const sctx     = scene.getContext("2d", { alpha: false, willReadFrequently: false });
const logoCanvas = document.createElement("canvas");
const ctx      = logoCanvas.getContext("2d", { alpha: true });

const PX  = Math.max(1, C.view.pixelSize | 0);
const FAR = -Infinity;   // must be exactly representable in a Float32Array,
                         // or "is this pixel empty" silently never matches

let W = 0, H = 0;              // logo buffer, in rendered pixels
let VW = 0, VH = 0;            // window, in CSS pixels
let DPR = 1;
let depth, gnx, gny, gnz, sbuf, cbuf, imgData, px;
let sxA, syA, szA, vnx, vny, vnz;

function allocVerts() {
  const V = mesh.vertCount;
  sxA = new Float32Array(V); syA = new Float32Array(V); szA = new Float32Array(V);
  vnx = new Float32Array(V); vny = new Float32Array(V); vnz = new Float32Array(V);
}
allocVerts();

function resize(cssW, cssH, dpr) {
  VW = cssW; VH = cssH; DPR = dpr;
  scene.width  = Math.round(cssW * dpr);
  scene.height = Math.round(cssH * dpr);

  W = Math.max(64, Math.round(cssW / PX));
  H = Math.max(64, Math.round(cssH / PX));
  logoCanvas.width = W; logoCanvas.height = H;

  depth = new Float32Array(W*H);
  gnx = new Float32Array(W*H); gny = new Float32Array(W*H); gnz = new Float32Array(W*H);
  sbuf = new Int16Array(W*H);
  cbuf = new Uint8Array(W*H);
  // Only the logo's own box is re-cleared each frame, so everywhere else has
  // to start out empty. A fresh Float32Array is 0, not -Infinity, and 0 reads
  // as "solid surface right at the centre of the world".
  depth.fill(FAR); sbuf.fill(-1); cbuf.fill(0);
  imgData = ctx.createImageData(W, H);
  px = imgData.data;
  ctx.clearRect(0, 0, W, H);

  prevBox = null;
  if (openProject >= 0) layoutFeed(openProject);
  dirty = true;
}

/* ==========================================================================
   8.  RENDER — the logo into its own small canvas
   ========================================================================== */
function scalePx() { return sizeT.v * Math.min(W, H) / mesh.radius; }

/* Where the logo's middle sits, in rendered pixels. Nudged inwards if it
   would hang off the edge — on a narrow window the parked logo would
   otherwise be sliced in half by the left margin. */
function logoCentre() {
  const r = mesh.radius * scalePx();
  let ox = cxT.v * W, oy = cyT.v * H;
  if (r * 2 <= W) ox = clamp(ox, r, W - r);
  if (r * 2 <= H) oy = clamp(oy, r, H - r);
  return { ox, oy, r };
}

let prevBox = null;
function logoBox() {
  const L = logoCentre(), r = L.r + 3;
  return {
    x0: clamp(Math.floor(L.ox - r), 0, W-1), x1: clamp(Math.ceil(L.ox + r), 0, W-1),
    y0: clamp(Math.floor(L.oy - r), 0, H-1), y1: clamp(Math.ceil(L.oy + r), 0, H-1),
  };
}
function unionBox(a, b) {
  if (!a) return b; if (!b) return a;
  return { x0: Math.min(a.x0,b.x0), x1: Math.max(a.x1,b.x1),
           y0: Math.min(a.y0,b.y0), y1: Math.max(a.y1,b.y1) };
}

function renderLogo() {
  const box = logoBox();
  const paintB = unionBox(prevBox, box);
  prevBox = box;

  for (let y = paintB.y0; y <= paintB.y1; y++) {
    const a = y*W + paintB.x0, b = y*W + paintB.x1 + 1;
    depth.fill(FAR, a, b); sbuf.fill(-1, a, b); cbuf.fill(0, a, b);
  }

  // Rotate into view space, then project with NO perspective divide — that is
  // what makes this axonometric rather than a photograph.
  const M = qToMat(q);
  const m0=M[0], m1=M[1], m2=M[2], m3=M[3], m4=M[4], m5=M[5], m6=M[6], m7=M[7], m8=M[8];
  const S = scalePx(), L = logoCentre(), ox = L.ox, oy = L.oy;
  const p = mesh.pos, n = mesh.nrm, V = mesh.vertCount;
  for (let i = 0, j = 0; i < V; i++, j += 3) {
    const x=p[j], y=p[j+1], z=p[j+2];
    sxA[i] = ox + (m0*x + m1*y + m2*z) * S;
    syA[i] = oy - (m3*x + m4*y + m5*z) * S;    // screen y points down
    szA[i] =      (m6*x + m7*y + m8*z);
    const nx=n[j], ny=n[j+1], nz=n[j+2];
    vnx[i] = m0*nx + m1*ny + m2*nz;
    vny[i] = m3*nx + m4*ny + m5*nz;
    vnz[i] = m6*nx + m7*ny + m8*nz;
  }

  const idx = mesh.idx, tri = mesh.tri, cap = mesh.cap;
  for (let t = 0, f = 0; t < idx.length; t += 3, f++) drawTriangle(idx[t], idx[t+1], idx[t+2], tri[f], cap[f]);

  samplePick();
  dotVisible = dotIsVisible();
  paint(paintB);
  paintLines(paintB);
  paintDot();
  // The first two numbers place the whole buffer at the origin; the last four
  // are the dirty rectangle — the only part actually copied. Passing an
  // offset in BOTH places double-shifts the image.
  ctx.putImageData(imgData, 0, 0, paintB.x0, paintB.y0,
                   paintB.x1 - paintB.x0 + 1, paintB.y1 - paintB.y0 + 1);
}

/* ==========================================================================
   9.  PICKING
   Which slice is under the cursor is read straight out of the slice buffer,
   so it is pixel-exact and automatically respects what is hidden behind what.
   ========================================================================== */
let mouseX = -1, mouseY = -1, pickSlice = -1;
function samplePick() {
  if (mouseX < 0) { pickSlice = -1; return; }
  const x = Math.round(mouseX / PX), y = Math.round(mouseY / PX);
  pickSlice = (x < 0 || y < 0 || x >= W || y >= H || depth[y*W + x] === FAR) ? -1 : sbuf[y*W + x];
}

// Is the cursor on the centre dot? Only counts while the dot is actually in
// front of the ring — you should not be able to poke something you can't see.
function dotHovered(clientX, clientY) {
  if (!C.dot.show || !dotVisible) return false;
  const L = logoCentre();
  const r = Math.max(C.dot.hitRadius, C.dot.radius * C.dot.spike * PX);
  return Math.hypot(clientX - L.ox * PX, clientY - L.oy * PX) <= r;
}

function inLogoBox(clientX, clientY) {
  const L = logoCentre();
  return Math.abs(clientX - L.ox * PX) <= L.r * PX &&
         Math.abs(clientY - L.oy * PX) <= L.r * PX;
}

/* ==========================================================================
   10. DRAWING THE PAGE
   Plain canvas drawing: rectangles and text. No DOM anywhere, because the
   glass can only bend a texture.
   ========================================================================== */
const INK_CSS = C.colour.ink, PAPER_CSS = C.colour.paper;

function mono(size, spacing) {
  sctx.font = size + 'px "Courier New", Courier, monospace';
  // letterSpacing is not in every browser yet; without it the type is simply
  // tighter, which is a cosmetic loss rather than a broken layout.
  if ("letterSpacing" in sctx) sctx.letterSpacing = (spacing || 0) + "px";
}

// Images are loaded once and kept. Until one arrives its slot draws as an
// outlined placeholder, so the layout never jumps when it lands.
const imgCache = new Map();
function getImage(src) {
  if (!src) return null;
  if (imgCache.has(src)) return imgCache.get(src);
  const im = new Image();
  im.onload = () => { dirty = true; };
  im.onerror = () => { imgCache.set(src, null); };
  im.src = src;
  imgCache.set(src, im);
  return im;
}
function drawFramed(x, y, w, h, src, label) {
  const im = getImage(src);
  if (im && im.complete && im.naturalWidth) {
    // cover-fit, so a photo of any shape fills its frame without distorting
    const sc = Math.max(w / im.naturalWidth, h / im.naturalHeight);
    const dw = im.naturalWidth * sc, dh = im.naturalHeight * sc;
    sctx.save(); sctx.beginPath(); sctx.rect(x, y, w, h); sctx.clip();
    sctx.drawImage(im, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh);
    sctx.restore();
  } else {
    sctx.fillStyle = PAPER_CSS;
    sctx.fillRect(x, y, w, h);
    if (label) {
      // save/restore, because textAlign and textBaseline are sticky on a 2D
      // context — leaving them set here silently centres the next paragraph
      // of body copy somewhere else on the page.
      sctx.save();
      mono(9, 2);
      sctx.globalAlpha = 0.45;
      sctx.textAlign = "center"; sctx.textBaseline = "middle";
      sctx.fillStyle = INK_CSS;
      sctx.fillText(label.toUpperCase(), x + w / 2, y + h / 2);
      sctx.restore();
    }
  }
  sctx.strokeStyle = INK_CSS;
  sctx.lineWidth = 1;
  sctx.strokeRect(Math.round(x) + 0.5, Math.round(y) + 0.5, Math.round(w), Math.round(h));
}

/* --- the project feed ---------------------------------------------------
   Laid out once when a project opens, into a list of rectangles, then just
   drawn with the scroll offset applied. Positions come from a fixed seed per
   project, so a project looks the same every time you open it rather than
   reshuffling under you.
   ---------------------------------------------------------------------- */
let feedItems = [], feedHeight = 0, feedHead = null, scrollY = 0, scrollTarget = 0;

function layoutFeed(i) {
  const pr = C.projects[i], F = C.feed;
  const colW = F.columnWidth * VW;
  const colX = (VW - colW) / 2;
  const rnd = seeded(0xC0FFEE + i * 7919);

  const logoR = C.view.sizeCorner * Math.min(W, H) * PX;
  const headY = Math.max(VH * 0.16, Math.max(C.view.cornerY * H * PX, logoR) + logoR + 30);
  feedHead = { x: colX, y: headY, title: pr.title, year: pr.year || "", blurb: pr.blurb || "" };

  feedItems = [];
  let y = VH * 0.42, bottom = y;

  (pr.feed || []).forEach((it, k) => {
    const w = colW * (F.itemMin + rnd() * (F.itemMax - F.itemMin));
    // Items alternate between a left-leaning and a right-leaning lane before
    // the scatter is added. Without that they pile up in the middle and sit
    // directly on top of each other rather than reading as a collage.
    const lane = (k % 2 === 0) ? 0.06 : 0.52;
    const x = colX + clamp(colW * lane + (rnd() - 0.5) * F.scatter * colW, 0, Math.max(0, colW - w));

    let h;
    if (it.type === "text") {
      const lines = wrapText(it.body || "", w, 12);
      h = lines.length * 22 + 8;
      feedItems.push({ type: "text", x, y, w, h, lines });
    } else {
      const bh = w / (it.ratio || 1);
      h = bh + 24;
      feedItems.push({ type: "image", x, y, w, h: bh, src: it.src, label: pr.title + " — " + (k+1),
                       cap: pr.title + " / " + (k+1) });
    }
    bottom = Math.max(bottom, y + h);
    // Advance by only part of the item's height, so the next one can ride up
    // alongside this one. That partial step is the whole difference between a
    // column and a scatter.
    y += h * (F.stackMin + rnd() * (F.stackMax - F.stackMin))
       + VH * (F.gapMin + rnd() * (F.gapMax - F.gapMin));
  });

  feedHeight = Math.max(bottom, y) + VH * 0.25;
  scrollY = scrollTarget = 0;
}

function wrapText(text, maxW, size) {
  mono(size, 0.5);
  const words = String(text).split(/\s+/), out = [];
  let line = "";
  for (const wd of words) {
    const t = line ? line + " " + wd : wd;
    if (sctx.measureText(t).width > maxW && line) { out.push(line); line = wd; }
    else line = t;
  }
  if (line) out.push(line);
  return out;
}

function drawFeed() {
  if (openProject < 0) return;
  const oy = -scrollY;

  sctx.fillStyle = INK_CSS;
  sctx.textAlign = "left"; sctx.textBaseline = "alphabetic";

  mono(15, 3.6);
  sctx.fillText(feedHead.title.toUpperCase(), feedHead.x, feedHead.y + oy);
  mono(10, 2.4);
  sctx.globalAlpha = 0.6;
  sctx.fillText(feedHead.year, feedHead.x, feedHead.y + 24 + oy);
  sctx.globalAlpha = 0.8;
  mono(11, 0.9);
  wrapText(feedHead.blurb, Math.min(420, VW * 0.4), 11)
    .forEach((l, i) => sctx.fillText(l, feedHead.x, feedHead.y + 52 + i * 20 + oy));
  sctx.globalAlpha = 1;

  for (const it of feedItems) {
    sctx.textAlign = "left"; sctx.textBaseline = "alphabetic";
    const y = it.y + oy;
    if (y > VH + 40 || y + it.h < -40) continue;      // off screen, skip it
    if (it.type === "image") {
      drawFramed(it.x, y, it.w, it.h, it.src, it.label);
      mono(9, 1.8);
      sctx.globalAlpha = 0.6;
      sctx.fillStyle = INK_CSS;
      sctx.fillText(it.cap.toUpperCase(), it.x, y + it.h + 16);
      sctx.globalAlpha = 1;
    } else {
      mono(12, 0.5);
      sctx.fillStyle = INK_CSS;
      it.lines.forEach((l, i) => sctx.fillText(l, it.x, y + 16 + i * 22));
    }
  }
}

/* --- the hover preview -------------------------------------------------- */
let coverFor = -1, coverAlpha = 0, coverTarget = 0, coverBox = null;
const coverRand = seeded(0x5EED);

function placeCover(i) {
  const pr = C.projects[i];
  let cw = C.cover.width * VW, ch = cw * 0.72;
  const ringPx = mesh.radius * scalePx() * PX;
  const pad = C.cover.clearance * Math.min(VW, VH);
  const ccx = VW / 2, ccy = VH / 2;
  const start = coverRand() * Math.PI * 2;

  function place(w, h) {
    const d = ringPx + pad + Math.max(w, h + 26) / 2;
    let best = null, bestGap = -Infinity;
    for (let k = 0; k < 12; k++) {
      const a = start + k * Math.PI * 2 / 12;
      const l = clamp(ccx + Math.cos(a) * d - w/2, 16, Math.max(16, VW - w - 16));
      const t = clamp(ccy + Math.sin(a) * d - h/2, 16, Math.max(16, VH - h - 42));
      const nx = clamp(ccx, l, l + w), ny = clamp(ccy, t, t + h + 26);
      const gap = Math.hypot(ccx - nx, ccy - ny) - ringPx;
      if (gap > bestGap) { bestGap = gap; best = [l, t]; }
      if (gap >= pad) break;
    }
    return { l: best[0], t: best[1], gap: bestGap };
  }

  /* On a small window there may be no room outside the ring for a card this
     size, and every direction ends up clamped back on top of it. Rather than
     let it overlap, shrink the card until it fits. */
  let spot = place(cw, ch);
  for (let n = 0; n < 8 && spot.gap < 0; n++) { cw *= 0.88; ch = cw * 0.72; spot = place(cw, ch); }
  coverBox = { x: spot.l, y: spot.t, w: cw, h: ch, title: pr.title, year: pr.year || "", src: pr.cover };
}

function drawCover() {
  if (coverAlpha <= 0.004 || !coverBox) return;
  const b = coverBox;
  sctx.save();
  sctx.globalAlpha = coverAlpha;
  drawFramed(b.x, b.y, b.w, b.h, b.src, b.title);
  mono(10, 2);
  sctx.fillStyle = INK_CSS;
  sctx.textAlign = "left"; sctx.textBaseline = "alphabetic";
  sctx.fillText(b.title.toUpperCase(), b.x, b.y + b.h + 17);
  sctx.textAlign = "right";
  sctx.fillText(b.year, b.x + b.w, b.y + b.h + 17);
  sctx.restore();
}

/* --- the hint line ------------------------------------------------------ */
let hintText = "", hintAlpha = 0, hintUntil = 0, clock = 0;
function hint(t) { hintText = t; hintUntil = clock + 2.6; }
function drawHint() {
  if (hintAlpha <= 0.004 || !hintText) return;
  sctx.globalAlpha = hintAlpha * 0.45;
  sctx.fillStyle = INK_CSS;
  mono(10, 2.6);
  sctx.textAlign = "center"; sctx.textBaseline = "alphabetic";
  sctx.fillText(hintText.toUpperCase(), VW / 2, VH - 22);
  sctx.globalAlpha = 1;
}

/* --- put the whole page together --------------------------------------- */
function drawPage() {
  sctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  sctx.fillStyle = PAPER_CSS;
  sctx.fillRect(0, 0, VW, VH);

  drawFeed();                       // content first...

  // ...then the logo over the top of it. It is drawn small and blown up with
  // smoothing off, which is where the hard pixel edges come from.
  sctx.imageSmoothingEnabled = false;
  sctx.drawImage(logoCanvas, 0, 0, W, H, 0, 0, W * PX, H * PX);
  sctx.imageSmoothingEnabled = true;

  drawCover();
  drawHint();
}

/* ==========================================================================
   11. STATE CHANGES
   ========================================================================== */
function goSpin() {
  state = "spin";
  // Tip back to the resting axonometric, keeping whatever turn it is already
  // at, then let the idle spin take over from there.
  poseTo(nearestPose(C.view.tiltRest), C.motion.snapTime);
  omega = [0, 0, 0];
  to(sizeT, C.view.size, C.motion.snapTime);
  to(cxT, 0.5, C.motion.snapTime); to(cyT, 0.5, C.motion.snapTime);
  openProject = -1;
  setHover(-1);
  hint("press the ring");
}

function goTop() {
  state = "top";
  // Always lands with the gap in the same place, so the menu reads as a C
  // every time rather than however it happened to be turned.
  poseTo(fixedPose(C.view.tiltTop, topPoseSpin()), C.motion.snapTime);
  omega = [0, 0, 0];
  to(sizeT, C.view.sizeTop, C.motion.snapTime);
  to(cxT, 0.5, C.motion.snapTime); to(cyT, 0.5, C.motion.snapTime);
  openProject = -1;
  hint("press a slice to open it · press the dot to release");
}

function goProject(i) {
  state = "project";
  openProject = i;
  // Parked in the corner it holds still, with the gap turned towards you.
  // The idle spin does not run in this state, so "always" really is always.
  poseTo(fixedPose(C.view.tiltRest, cornerPoseSpin()), C.motion.openTime);
  omega = [0, 0, 0];
  to(sizeT, C.view.sizeCorner, C.motion.openTime);
  to(cxT, C.view.cornerX, C.motion.openTime);
  to(cyT, C.view.cornerY, C.motion.openTime);
  setHover(-1);
  layoutFeed(i);
  hint("press the logo to go back");
}

function closeProject() { goTop(); }

/* ==========================================================================
   12. HOVER
   ========================================================================== */
function setHover(sl) {
  if (sl === hoverSlice) return;
  hoverSlice = sl;
  sliceTarget.fill(0);
  if (sl >= 0 && sl < NS) sliceTarget[sl] = 1;
  if (sl >= 0) { if (sl !== coverFor) { coverFor = sl; placeCover(sl); } coverTarget = 1; }
  else coverTarget = 0;
  dirty = true;
}

/* ==========================================================================
   13. POINTER
   A press and a drag are the same gesture until the pointer has moved far
   enough — under `clickSlop` pixels it counts as a press and changes state,
   beyond it, it tumbles the ring.
   ========================================================================== */
let downAt = null, didDrag = false, lastMove = null;

window.addEventListener("pointerdown", (e) => {
  downAt = { x: e.clientX, y: e.clientY };
  lastMove = { x: e.clientX, y: e.clientY, t: performance.now() };
  didDrag = false;
});

window.addEventListener("pointermove", (e) => {
  mouseX = e.clientX; mouseY = e.clientY;
  dirty = true;
  if (!downAt) return;

  const moved = Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y);
  if (moved > C.motion.clickSlop) didDrag = true;
  // Dragging tumbles it in the resting state; in the menu the pointer is for
  // aiming at slices, not for turning the ring.
  if (didDrag && state === "spin" && lastMove) {
    const now = performance.now();
    const dx = e.clientX - lastMove.x, dy = e.clientY - lastMove.y;
    const dt = Math.max(1, now - lastMove.t) / 1000;

    /* Free tumble. Sideways drag turns it about the screen's vertical axis,
       up-and-down about the screen's horizontal one — and any mixture of the
       two is a single rotation about the axis at right angles to the way your
       hand moved. Applied on the LEFT of the current orientation, which makes
       it relative to what you are looking at rather than to whichever way the
       ring happens to be facing. */
    const deg = Math.hypot(dx, dy) * C.motion.sensitivity;
    if (deg > 0) {
      q = qNorm(qMul(qAxis(dy, dx, 0, deg), q));
      slerpT = 1;                                    // a drag cancels a snap
      const rate = deg / dt, s = C.motion.flickSmoothing, l = Math.hypot(dx, dy);
      omega = [omega[0]*s + (dy/l)*rate*(1-s), omega[1]*s + (dx/l)*rate*(1-s), 0];
    }
    lastMove = { x: e.clientX, y: e.clientY, t: now };
  }
});

window.addEventListener("pointerup", (e) => {
  const wasDrag = didDrag;
  downAt = null; didDrag = false;

  if (wasDrag) {
    const sp = Math.hypot(omega[0], omega[1], omega[2]), m = C.motion.maxSpeed;
    if (sp > m) omega = [omega[0]*m/sp, omega[1]*m/sp, omega[2]*m/sp];
    return;
  }

  mouseX = e.clientX; mouseY = e.clientY;
  samplePick();
  const onLogo = inLogoBox(e.clientX, e.clientY);
  const onDot  = dotHovered(e.clientX, e.clientY);
  if (state === "spin") {
    // The dot is the handle: pressing it opens the menu, same as pressing a
    // slice, which is why it puffs up under the cursor.
    if (onDot || pickSlice >= 0) goTop();
  } else if (state === "top") {
    if (onDot) goSpin();           // press the dot to let it go back to spinning
    else if (pickSlice >= 0) goProject(pickSlice);
    else if (onLogo) goSpin();     // a press out on the page does nothing
  } else if (state === "project") {
    // The parked logo is small, so anywhere in its box counts rather than
    // making you hit the ring itself.
    if (onLogo) closeProject();
  }
});

// The feed scrolls, but there is no scrollbar to hand the job to — the page
// is a texture. So the wheel drives a number, and the number eases.
window.addEventListener("wheel", (e) => {
  if (state !== "project") return;
  e.preventDefault();
  // Firefox reports wheel deltas in LINES, roughly 1/16 the size of Chrome's
  // pixels. Without this the feed crawls in one browser and bolts in the other.
  const k = e.deltaMode === 1 ? 16 : (e.deltaMode === 2 ? VH : 1);
  scrollTarget = clamp(scrollTarget + e.deltaY * k, 0, Math.max(0, feedHeight - VH));
  dirty = true;
}, { passive: false });

window.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { if (state === "project") closeProject(); else if (state === "top") goSpin(); }
});

/* ==========================================================================
   14. ONE STEP OF THE PAGE
   Called by the glass module from its own clock. Returns true if anything
   changed — sending a full-window texture to the graphics card is by a wide
   margin the most expensive thing in this file, so it only happens when
   there is genuinely something new to send.
   ========================================================================== */
function update(dt) {
  clock += dt;
  let moving = false;

  moving = step(sizeT, dt) || moving;
  moving = step(cxT, dt)   || moving;
  moving = step(cyT, dt)   || moving;

  if (slerpT < 1) {
    // Snapping between poses. Nothing else touches the orientation while this
    // is running.
    slerpT = Math.min(1, slerpT + dt / slerpDur);
    q = qSlerp(slerpA, slerpB, easeInOut(slerpT));
    moving = true;
  } else {
    const sp = Math.hypot(omega[0], omega[1], omega[2]);
    if (sp > 0) {
      q = qNorm(qMul(qAxis(omega[0], omega[1], omega[2], sp * dt), q));
      const k = Math.pow(C.motion.friction, dt * 60);   // frame-rate independent
      omega = [omega[0]*k, omega[1]*k, omega[2]*k];
      if (Math.hypot(omega[0], omega[1], omega[2]) < C.motion.stopBelow) omega = [0,0,0];
      moving = true;
    }
    // The idle spin turns the ring about its OWN axle, so it keeps looking
    // like a spinning ring however you have tumbled it. Applied on the right
    // of the orientation, which is what makes it object-space.
    const holdForHover = C.motion.pauseSpinOnHover && (hoverSlice >= 0 || dotShade > 0.02);
    if (state === "spin" && C.motion.idleSpin !== 0 && !downAt && !holdForHover) {
      q = qNorm(qMul(q, qAxis(0, 1, 0, C.motion.idleSpin * dt)));
      moving = true;
    }
  }

  // Hover only means something in the menu. In the resting state the ring is
  // an object, not a set of buttons. The dot takes priority: if you are
  // pointing at it, you are not pointing at a slice behind it.
  const overDot = dotHovered(mouseX, mouseY);
  setHover((state === "top" && !downAt && !overDot) ? pickSlice : -1);
  dotTarget = overDot ? 1 : 0;

  const ks = 1 - Math.pow(0.001, dt / (Math.max(1, C.shade.fadeTime) / 1000));
  for (let i = 0; i < NS; i++) {
    const d = sliceTarget[i] - sliceShade[i];
    if (Math.abs(d) > 0.001) { sliceShade[i] += d * ks; moving = true; }
    else sliceShade[i] = sliceTarget[i];
  }
  const kd = 1 - Math.pow(0.001, dt / (Math.max(1, C.dot.fadeTime) / 1000));
  if (Math.abs(dotTarget - dotShade) > 0.001) { dotShade += (dotTarget - dotShade) * kd; moving = true; }
  else dotShade = dotTarget;

  const kc = 1 - Math.pow(0.001, dt / (Math.max(1, C.cover.fadeTime) / 1000));
  if (Math.abs(coverTarget - coverAlpha) > 0.002) { coverAlpha += (coverTarget - coverAlpha) * kc; moving = true; }
  else coverAlpha = coverTarget;

  const ha = clock < hintUntil ? 1 : 0;
  if (Math.abs(ha - hintAlpha) > 0.002) { hintAlpha += (ha - hintAlpha) * (1 - Math.pow(0.001, dt / 0.5)); moving = true; }
  else hintAlpha = ha;

  if (Math.abs(scrollTarget - scrollY) > 0.4) {
    scrollY += (scrollTarget - scrollY) * (1 - Math.pow(0.001, dt / 0.22));
    moving = true;
  } else scrollY = scrollTarget;

  if (!moving && !dirty) return false;
  dirty = false;
  renderLogo();
  drawPage();
  return true;
}

/* --- what the glass module is handed ----------------------------------- */
resize(window.innerWidth, window.innerHeight, Math.min(window.devicePixelRatio || 1, 2));
hint("press the ring");

return {
  canvas: scene,
  resize, update,
  // Exposed so a screenshot script (or you, in the console) can drive it.
  goSpin, goTop, goProject, closeProject,
  settle() { for (const t of [sizeT, cxT, cyT]) { t.t = 1; t.v = t.to; }
             if (slerpT < 1) { q = slerpB; slerpT = 1; }
             for (let i = 0; i < NS; i++) sliceShade[i] = sliceTarget[i];
             dotShade = dotTarget; coverAlpha = coverTarget;
             dirty = true; renderLogo(); drawPage(); },
  setYaw(v) { q = qNorm(qMul(qAxis(1,0,0,C.view.tiltRest), qAxis(0,1,0,v))); slerpT = 1; dirty = true; },
  setPose(qq) { q = qNorm(qq); slerpT = 1; dirty = true; },
  drag(dx, dy) { const deg = Math.hypot(dx,dy) * C.motion.sensitivity;
                 q = qNorm(qMul(qAxis(dy, dx, 0, deg), q)); slerpT = 1; dirty = true; },
  probe(cx, cy) { mouseX = cx; mouseY = cy; renderLogo(); return pickSlice; },
  scrollTo(v) { scrollTarget = clamp(v, 0, Math.max(0, feedHeight - VH)); dirty = true; },
  get state() { return state; },
  get pick() { return pickSlice; },
  get dotVisible() { return dotVisible; },
  get dotShade() { return dotShade; },
  get feedHeight() { return feedHeight; },
  mesh,
};

}

/* ==========================================================================
   THE GLASS
   Lifted from the liquid-glass prototype essentially unchanged. The only edits
   are that its settings now live under CONFIG.glass, and that drawScene()
   takes the real page instead of drawing a fake one.
   ========================================================================== */
function startGlass() {
  if (!CONFIG.glass.enabled) { runPlain(); return; }
  const probe = document.getElementById("glass").getContext("webgl2");
  if (!probe) {
    // No WebGL2 — show the page flat rather than nothing at all.
    console.warn("WebGL2 unavailable; running without the glass.");
    runPlain();
    return;
  }
  GLASS(CONFIG);
}

/* The fallback, and also what you get with glass.enabled turned off: the same
   page, blitted straight to the screen with no refraction. */
function runPlain() {
  const canvas = document.getElementById("glass");
  const ctx = canvas.getContext("2d");
  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 1/30);
    last = now;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    if (canvas.width !== Math.round(window.innerWidth * dpr)) {
      canvas.width  = Math.round(window.innerWidth  * dpr);
      canvas.height = Math.round(window.innerHeight * dpr);
      PAGE.resize(window.innerWidth, window.innerHeight, dpr);
    }
    if (PAGE.update(dt)) ctx.drawImage(PAGE.canvas, 0, 0);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

function GLASS(ROOT) {
(function () {
  'use strict';

  // Every glass setting lives under CONFIG.glass in the merged config. It is
  // rebound to the bare name `CONFIG` here so the whole of the rest of this
  // module reads exactly as it did when it was a standalone prototype — the
  // outer one arrives as ROOT because you cannot shadow a name and read it
  // in the same scope.
  const CONFIG = ROOT.glass;


  const canvas = document.getElementById('glass');
  const gl = canvas.getContext('webgl2', { alpha: false, antialias: false, depth: false, stencil: false });

  if (!gl) {
    document.body.innerHTML = '<p style="font:16px/1.6 sans-serif;padding:3rem">' +
      "This effect needs WebGL2, which this browser doesn't have.</p>";
    return;
  }
  gl.getExtension('EXT_color_buffer_float');
  const HALF = gl.HALF_FLOAT;

  // The page behind the canvas only shows for the instant before the first
  // frame lands, so it matches the paper rather than the old demo's blue.
  document.documentElement.style.background = ROOT.colour.paper;
  document.body.style.background = ROOT.colour.paper;

  /* ---------------- shader helpers ---------------- */

  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s) + '\n' + src);
    return s;
  }
  function program(vs, fs) {
    const p = gl.createProgram();
    gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
    gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    const uniforms = {};
    const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < n; i++) {
      const name = gl.getActiveUniform(p, i).name;
      uniforms[name] = gl.getUniformLocation(p, name);
    }
    return { p, uniforms };
  }

  const VERT = `#version 300 es
  precision highp float;
  in vec2 aPos;
  out vec2 vUv, vL, vR, vT, vB;
  uniform vec2 uTexel;
  void main () {
    vUv = aPos * 0.5 + 0.5;
    vL = vUv - vec2(uTexel.x, 0.0);
    vR = vUv + vec2(uTexel.x, 0.0);
    vT = vUv + vec2(0.0, uTexel.y);
    vB = vUv - vec2(0.0, uTexel.y);
    gl_Position = vec4(aPos, 0.0, 1.0);
  }`;

  const HEAD = `#version 300 es
  precision highp float;
  precision highp sampler2D;
  in vec2 vUv, vL, vR, vT, vB;
  out vec4 fragColor;
  `;

  const ADVECT = HEAD + `
  uniform sampler2D uSource, uVelocity;
  uniform vec2 uTexel;
  uniform float dt, dissipation;
  void main () {
    vec2 coord = vUv - dt * texture(uVelocity, vUv).xy * uTexel;
    fragColor = texture(uSource, coord) * dissipation;
  }`;

  const DIVERGENCE = HEAD + `
  uniform sampler2D uVelocity;
  void main () {
    float L = texture(uVelocity, vL).x, R = texture(uVelocity, vR).x;
    float T = texture(uVelocity, vT).y, B = texture(uVelocity, vB).y;
    vec2 C = texture(uVelocity, vUv).xy;
    if (vL.x < 0.0) L = -C.x;
    if (vR.x > 1.0) R = -C.x;
    if (vT.y > 1.0) T = -C.y;
    if (vB.y < 0.0) B = -C.y;
    fragColor = vec4(0.5 * (R - L + T - B), 0.0, 0.0, 1.0);
  }`;

  const CURL = HEAD + `
  uniform sampler2D uVelocity;
  void main () {
    float L = texture(uVelocity, vL).y, R = texture(uVelocity, vR).y;
    float T = texture(uVelocity, vT).x, B = texture(uVelocity, vB).x;
    fragColor = vec4(0.5 * (R - L - T + B), 0.0, 0.0, 1.0);
  }`;

  const VORTICITY = HEAD + `
  uniform sampler2D uVelocity, uCurl;
  uniform float curlAmount, dt;
  void main () {
    float L = texture(uCurl, vL).x, R = texture(uCurl, vR).x;
    float T = texture(uCurl, vT).x, B = texture(uCurl, vB).x;
    float C = texture(uCurl, vUv).x;
    vec2 force = 0.5 * vec2(abs(T) - abs(B), abs(R) - abs(L));
    force /= length(force) + 0.0001;
    force *= curlAmount * C;
    force.y *= -1.0;
    fragColor = vec4(clamp(texture(uVelocity, vUv).xy + force * dt, -1000.0, 1000.0), 0.0, 1.0);
  }`;

  const PRESSURE = HEAD + `
  uniform sampler2D uPressure, uDivergence;
  void main () {
    float L = texture(uPressure, vL).x, R = texture(uPressure, vR).x;
    float T = texture(uPressure, vT).x, B = texture(uPressure, vB).x;
    fragColor = vec4((L + R + B + T - texture(uDivergence, vUv).x) * 0.25, 0.0, 0.0, 1.0);
  }`;

  const GRADIENT = HEAD + `
  uniform sampler2D uPressure, uVelocity;
  void main () {
    float L = texture(uPressure, vL).x, R = texture(uPressure, vR).x;
    float T = texture(uPressure, vT).x, B = texture(uPressure, vB).x;
    fragColor = vec4(texture(uVelocity, vUv).xy - vec2(R - L, T - B), 0.0, 1.0);
  }`;

  const SPLAT = HEAD + `
  uniform sampler2D uTarget;
  uniform float aspectRatio, radius, stretch;
  uniform vec2 point, dir;
  uniform vec3 color;
  void main () {
    vec2 p = vUv - point;
    p.x *= aspectRatio;

    /* Stretch the blob ALONG the direction of travel. A round blob centred on
       the pointer reads as a disc following the cursor; an elongated one laid
       down repeatedly along the path reads as a wake the cursor cut through
       the liquid — which is the difference between "a thing is here" and
       "something went past". The uniform dir is the way the pointer is
       heading, and the second axis is simply perpendicular to it. */
    vec2 along  = vec2(dot(p, dir), dot(p, vec2(-dir.y, dir.x)));
    along.x /= stretch;

    fragColor = vec4(texture(uTarget, vUv).xyz + exp(-dot(along, along) / radius) * color, 1.0);
  }`;

  /* THE GLASS PASS.
     Everything above this point is just moving liquid around. This is where
     it becomes a material. */
  const GLASS = HEAD + `
  uniform sampler2D uHeight;     // the liquid's surface
  uniform sampler2D uScene;      // the page, drawn flat
  uniform vec2 uTexel;
  uniform float uRefract, uDispersion, uSpecular, uRim, uRelief, uSmooth;

  float h (vec2 uv) { return length(texture(uHeight, uv).rgb); }

  void main () {
    // Read the surface softened, or every bit of simulation noise becomes a
    // facet and the material reads as crushed ice rather than glass.
    vec2 e = uTexel * uSmooth;
    float dx = h(vUv + vec2(e.x, 0.0)) - h(vUv - vec2(e.x, 0.0));
    float dy = h(vUv + vec2(0.0, e.y)) - h(vUv - vec2(0.0, e.y));
    float height = (h(vUv) * 2.0
                  + h(vUv + vec2(e.x, 0.0)) + h(vUv - vec2(e.x, 0.0))
                  + h(vUv + vec2(0.0, e.y)) + h(vUv - vec2(0.0, e.y))) / 6.0;

    // Which way the surface is tilted. Flat liquid gives (0,0,1) — straight
    // up — and from there everything below collapses to "leave it alone".
    vec3 n = normalize(vec3(-dx * uRelief, -dy * uRelief, 1.0));

    // Bend the view through the surface. Thicker liquid bends further.
    vec2 offset = n.xy * uRefract * (0.25 + height);

    // Glass splits light: blue bends further than red. Sampling the three
    // channels at slightly different offsets is the whole of it.
    float d = uDispersion;
    vec3 col;
    col.r = texture(uScene, vUv + offset * (1.0 - d)).r;
    col.g = texture(uScene, vUv + offset).g;
    col.b = texture(uScene, vUv + offset * (1.0 + d)).b;

    // A tight highlight where the surface happens to face the light.
    vec3 lightDir = normalize(vec3(-0.45, 0.65, 0.62));
    float spec = pow(max(dot(n, lightDir), 0.0), 48.0);

    // Surfaces seen edge-on reflect far more than flat ones. This is what
    // draws the bright thread around every fold, and it's the single biggest
    // reason the result reads as a solid transparent body.
    float rim = pow(1.0 - n.z, 1.6);

    /* Confine the highlights to where there IS liquid. Without this, the
       faintest slope anywhere on screen picks up a rim light and the whole
       page washes out to white. */
    float presence = smoothstep(0.0, 0.05, height);
    col += (spec * uSpecular + rim * uRim) * presence;
    fragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
  }`;

  const progAdvect = program(VERT, ADVECT);
  const progDiv    = program(VERT, DIVERGENCE);
  const progCurl   = program(VERT, CURL);
  const progVort   = program(VERT, VORTICITY);
  const progPress  = program(VERT, PRESSURE);
  const progGrad   = program(VERT, GRADIENT);
  const progSplat  = program(VERT, SPLAT);
  const progGlass  = program(VERT, GLASS);

  /* ---------------- geometry ---------------- */

  gl.bindVertexArray(gl.createVertexArray());
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

  function draw(target) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, target ? target.fbo : null);
    gl.viewport(0, 0, target ? target.w : gl.drawingBufferWidth,
                      target ? target.h : gl.drawingBufferHeight);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  function makeFBO(w, h, internalFormat, format) {
    const tex = gl.createTexture();
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D, 0, internalFormat, w, h, 0, format, HALF, null);
    const fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    gl.viewport(0, 0, w, h);
    gl.clear(gl.COLOR_BUFFER_BIT);
    return { tex, fbo, w, h, texelX: 1/w, texelY: 1/h,
      attach(id) { gl.activeTexture(gl.TEXTURE0 + id); gl.bindTexture(gl.TEXTURE_2D, tex); return id; } };
  }
  function makeDouble(w, h, internalFormat, format) {
    let a = makeFBO(w, h, internalFormat, format), b = makeFBO(w, h, internalFormat, format);
    return { w, h, texelX: 1/w, texelY: 1/h,
      get read() { return a; }, get write() { return b; },
      swap() { const t = a; a = b; b = t; } };
  }

  let velocity, height, divergence, curl, pressure;

  /* ---------------- the page, drawn into a texture ----------------
     The glass needs something behind it to bend. On the real site this would
     be whatever the page actually is; here it's drawn by hand.
     ---------------------------------------------------------------- */

  const sceneTex = gl.createTexture();

  /* ---------------- the page, handed over as a texture ----------------
     In the standalone prototype this drew a fake page by hand. Here it takes
     the real one: PAGE draws the logo, the menu, the previews and the whole
     project feed into its own 2D canvas, and that canvas is what the glass
     bends. Nothing on screen is a DOM element — it cannot be, because you
     cannot refract live HTML.
     ---------------------------------------------------------------------- */
  function drawScene() {
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, sceneTex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, PAGE.canvas);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  }

  function initFramebuffers() {
    const sim = CONFIG.motionDetail, surf = CONFIG.surfaceDetail;
    const aspect = canvas.width / canvas.height;
    const sw = aspect >= 1 ? Math.round(sim * aspect) : sim;
    const sh = aspect >= 1 ? sim : Math.round(sim / aspect);
    const hw = aspect >= 1 ? Math.round(surf * aspect) : surf;
    const hh = aspect >= 1 ? surf : Math.round(surf / aspect);

    velocity   = makeDouble(sw, sh, gl.RG16F,   gl.RG);
    height     = makeDouble(hw, hh, gl.RGBA16F, gl.RGBA);
    pressure   = makeDouble(sw, sh, gl.R16F,    gl.RED);
    divergence = makeFBO(sw, sh, gl.R16F, gl.RED);
    curl       = makeFBO(sw, sh, gl.R16F, gl.RED);
  }

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width  = Math.round(window.innerWidth * dpr);
    canvas.height = Math.round(window.innerHeight * dpr);
    initFramebuffers();
    PAGE.resize(window.innerWidth, window.innerHeight, dpr);
    drawScene();
  }

  /* ---------------- the pointer ---------------- */

  const pointer = {
    x: 0.5, y: 0.5, lastX: 0.5, lastY: 0.5,
    vx: 0, vy: 0,          // speed, in screen-widths per second
    speed: 0, strength: 0, // last measured speed, and what it ramps to
    down: false, seen: false
  };

  function updatePointer(clientX, clientY) {
    const x = clientX / window.innerWidth;
    const y = 1 - clientY / window.innerHeight;
    if (!pointer.seen) {
      pointer.x = pointer.lastX = x; pointer.y = pointer.lastY = y;
      pointer.seen = true; return;
    }
    pointer.x = x; pointer.y = y;
  }
  window.addEventListener('mousemove', e => updatePointer(e.clientX, e.clientY), { passive: true });
  window.addEventListener('mousedown', () => { pointer.down = true; });
  window.addEventListener('mouseup',   () => { pointer.down = false; });
  window.addEventListener('touchmove', e => {
    if (e.touches[0]) updatePointer(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });

  function splat(x, y, dx, dy, amount, dirX, dirY, stretch) {
    const aspect = canvas.width / canvas.height;
    const radius = CONFIG.pointerSize / 100;

    gl.useProgram(progSplat.p);
    gl.uniform2f(progSplat.uniforms.uTexel, velocity.texelX, velocity.texelY);
    gl.uniform1i(progSplat.uniforms.uTarget, velocity.read.attach(0));
    gl.uniform1f(progSplat.uniforms.aspectRatio, aspect);
    gl.uniform2f(progSplat.uniforms.point, x, y);
    gl.uniform2f(progSplat.uniforms.dir, dirX, dirY);
    gl.uniform1f(progSplat.uniforms.stretch, stretch);
    gl.uniform3f(progSplat.uniforms.color, dx, dy, 0);
    gl.uniform1f(progSplat.uniforms.radius, radius);
    draw(velocity.write); velocity.swap();

    gl.uniform2f(progSplat.uniforms.uTexel, height.texelX, height.texelY);
    gl.uniform1i(progSplat.uniforms.uTarget, height.read.attach(0));
    gl.uniform3f(progSplat.uniforms.color, amount, amount, amount);
    draw(height.write); height.swap();
  }

  /* Cut a wake through the liquid along the pointer's path.

     TWO things are governed by SPEED here, and they're the heart of how this
     feels:

     1. Below `stillSpeed` nothing happens at all. Hold the pointer still, or
        creep it along, and the liquid is left alone — no bulge builds up
        underneath it. Previously a stationary pointer kept pumping liquid
        into the same spot every frame until it blew out into a white blob,
        which is the opposite of the intended reading: the cursor should
        DISTURB the liquid by moving through it, not emit it.

     2. Between `stillSpeed` and `fullSpeed` the whole effect ramps up. A
        gentle drift barely marks the surface; a fast sweep tears a deep wake.
        So the amount of disturbance is a consequence of how hard you moved,
        which is what makes it feel like a physical medium.

     The blob is also stretched along the direction of travel and laid down
     repeatedly between the last position and the current one, so what's left
     behind is the PATH the pointer took rather than a disc around wherever it
     happens to be sitting.
     ---------------------------------------------------------------------- */
  function applyPointer(dt) {
    if (!pointer.seen || dt <= 0) return;

    const dx = pointer.x - pointer.lastX;
    const dy = pointer.y - pointer.lastY;
    const dist = Math.hypot(dx, dy);

    // Speed in screen-widths per second. Track it even while still, so that
    // stopping registers as a deceleration.
    const vx = dx / dt, vy = dy / dt;
    const ax = vx - pointer.vx, ay = vy - pointer.vy;
    pointer.vx = vx; pointer.vy = vy;

    const speed = Math.hypot(vx, vy);
    pointer.speed = speed;

    // The ramp. Smoothstep rather than a hard cut, so the effect fades in and
    // out instead of snapping on at the threshold.
    const lo = CONFIG.stillSpeed, hi = Math.max(CONFIG.fullSpeed, lo + 0.001);
    let t = (speed - lo) / (hi - lo);
    t = Math.max(0, Math.min(1, t));
    const strength = t * t * (3 - 2 * t);
    pointer.strength = strength;

    if (strength <= 0.001 || dist < 0.0005) {
      pointer.lastX = pointer.x;
      pointer.lastY = pointer.y;
      return;
    }

    const boost = CONFIG.accelerationBoost;
    const push = CONFIG.pointerForce * (pointer.down ? 2.0 : 1) * dt * strength;
    const fx = (vx + ax * boost) * push;
    const fy = (vy + ay * boost) * push;

    const dirX = dx / dist, dirY = dy / dist;
    const stretch = CONFIG.streak;

    const steps = Math.min(Math.ceil(dist / CONFIG.strokeSpacing), 40);
    const amount = CONFIG.displacement * strength / Math.max(1, steps / 4);

    for (let i = 1; i <= steps; i++) {
      const t2 = i / steps;
      splat(pointer.lastX + dx * t2, pointer.lastY + dy * t2,
            fx, fy, amount, dirX, dirY, stretch);
    }

    pointer.lastX = pointer.x;
    pointer.lastY = pointer.y;
  }

  /* ---------------- one step of the liquid ---------------- */

  function step(dt) {
    gl.disable(gl.BLEND);

    gl.useProgram(progCurl.p);
    gl.uniform2f(progCurl.uniforms.uTexel, velocity.texelX, velocity.texelY);
    gl.uniform1i(progCurl.uniforms.uVelocity, velocity.read.attach(0));
    draw(curl);

    gl.useProgram(progVort.p);
    gl.uniform2f(progVort.uniforms.uTexel, velocity.texelX, velocity.texelY);
    gl.uniform1i(progVort.uniforms.uVelocity, velocity.read.attach(0));
    gl.uniform1i(progVort.uniforms.uCurl, curl.attach(1));
    gl.uniform1f(progVort.uniforms.curlAmount, CONFIG.swirl);
    gl.uniform1f(progVort.uniforms.dt, dt);
    draw(velocity.write); velocity.swap();

    gl.useProgram(progDiv.p);
    gl.uniform2f(progDiv.uniforms.uTexel, velocity.texelX, velocity.texelY);
    gl.uniform1i(progDiv.uniforms.uVelocity, velocity.read.attach(0));
    draw(divergence);

    gl.useProgram(progPress.p);
    gl.uniform2f(progPress.uniforms.uTexel, velocity.texelX, velocity.texelY);
    gl.uniform1i(progPress.uniforms.uDivergence, divergence.attach(0));
    for (let i = 0; i < CONFIG.solverPasses; i++) {
      gl.uniform1i(progPress.uniforms.uPressure, pressure.read.attach(1));
      draw(pressure.write); pressure.swap();
    }

    gl.useProgram(progGrad.p);
    gl.uniform2f(progGrad.uniforms.uTexel, velocity.texelX, velocity.texelY);
    gl.uniform1i(progGrad.uniforms.uPressure, pressure.read.attach(0));
    gl.uniform1i(progGrad.uniforms.uVelocity, velocity.read.attach(1));
    draw(velocity.write); velocity.swap();

    // Fade rates are raised to the power of elapsed time, so the liquid
    // behaves the same on a 60Hz laptop and a 165Hz monitor.
    gl.useProgram(progAdvect.p);
    gl.uniform2f(progAdvect.uniforms.uTexel, velocity.texelX, velocity.texelY);
    gl.uniform1i(progAdvect.uniforms.uVelocity, velocity.read.attach(0));
    gl.uniform1i(progAdvect.uniforms.uSource, velocity.read.attach(0));
    gl.uniform1f(progAdvect.uniforms.dt, dt);
    gl.uniform1f(progAdvect.uniforms.dissipation, Math.pow(CONFIG.viscosity, dt * 60));
    draw(velocity.write); velocity.swap();

    gl.uniform2f(progAdvect.uniforms.uTexel, height.texelX, height.texelY);
    gl.uniform1i(progAdvect.uniforms.uVelocity, velocity.read.attach(0));
    gl.uniform1i(progAdvect.uniforms.uSource, height.read.attach(1));
    gl.uniform1f(progAdvect.uniforms.dissipation, Math.pow(CONFIG.settle, dt * 60));
    draw(height.write); height.swap();
  }

  function render() {
    gl.useProgram(progGlass.p);
    gl.uniform2f(progGlass.uniforms.uTexel, height.texelX, height.texelY);
    gl.uniform1i(progGlass.uniforms.uHeight, height.read.attach(0));
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, sceneTex);
    gl.uniform1i(progGlass.uniforms.uScene, 1);
    gl.uniform1f(progGlass.uniforms.uRefract, CONFIG.refraction);
    gl.uniform1f(progGlass.uniforms.uDispersion, CONFIG.dispersion);
    gl.uniform1f(progGlass.uniforms.uSpecular, CONFIG.specular);
    gl.uniform1f(progGlass.uniforms.uRim, CONFIG.rimLight);
    gl.uniform1f(progGlass.uniforms.uRelief, CONFIG.surfaceRelief);
    gl.uniform1f(progGlass.uniforms.uSmooth, CONFIG.smoothing);
    draw(null);
  }

  /* ---------------- go ---------------- */

  let last = performance.now();

  function frame(now) {
    const raw = (now - last) / 1000;
    last = now;
    const dt = Math.min(raw, 1 / 30);   // one slow frame can't make the fluid lurch

    /* The page gets its own, more generous clamp. The fluid solver has to be
       fed small steps or it goes unstable, but applying that same limit to
       the interface means that on a slow machine every transition runs in
       slow motion — a 700ms snap taking three seconds because the clock is
       only allowed to advance 33ms per frame. The page has no such stability
       problem, so it gets told how much time really passed. */
    const pageDt = Math.min(raw, 1 / 10);

    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    if (canvas.width !== Math.round(window.innerWidth * dpr)) resize();

    // The page is redrawn and re-uploaded only when something on it actually
    // moved. Sending a full-window texture to the card every frame is the
    // most expensive thing here by a wide margin, and while a project is open
    // and still there is nothing new to send.
    if (PAGE.update(pageDt)) drawScene();

    applyPointer(dt);
    step(dt);
    render();
    requestAnimationFrame(frame);
  }

  resize();
  requestAnimationFrame(frame);

  window.__glass = {
    CONFIG,
    get speed()    { return pointer.speed; },
    get strength() { return pointer.strength; },
    push(x, y, fx, fy) {
      const m = Math.hypot(fx, fy) || 1;
      splat(x, y, fx, fy, CONFIG.displacement, fx / m, fy / m, CONFIG.streak);
    }
  };
})();
}
</script>
</body>
</html>
